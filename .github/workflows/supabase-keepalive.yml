name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 06:00 UTC every 2 days
    - cron: '0 6 */2 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Supabase Ping & Activity
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail -sS "$SUPABASE_URL/rest/v1/content?select=section&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"

      - name: Ping Storage Bucket API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail -sS "$SUPABASE_URL/storage/v1/object/list/portfolio" \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"limit": 1, "prefix": ""}'
